# Alert rules. `expr` true -> alert "pending"; still true after `for` -> "firing".
groups:
  - name: ids-api
    rules:
      - alert: IdsApiDown
        expr: up{job="ids-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot reach the intrusion detection API - no flows are being scored."

      - alert: IdsDataDrift
        # The flows the model lets through no longer look like benign training traffic.
        # Typical cause: an attack type the model has never seen. Action: look at the top drifted
        # features in Grafana, get the traffic labelled, retrain (make retrain) and roll out.
        expr: ids_drift_detected == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Data drift in the traffic scored as benign - possible unseen attack type, consider retraining."

      - alert: IdsModelFallback
        # MODEL_URI could not be loaded at startup; the API serves the model baked into the image.
        expr: ids_model_info{fallback="true"} == 1
        labels:
          severity: warning
        annotations:
          summary: "The API could not load the registry champion and serves its baked-in model."

      - alert: IdsHighErrorRate
        expr: |
          sum(rate(ids_http_requests_total{status=~"5.."}[1m]))
            / sum(rate(ids_http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "More than 5 % of API requests fail with a server error."

      - alert: IdsSlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(ids_http_request_duration_seconds_bucket{path="/predict"}[2m]))) > 0.25
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency of /predict is above 250 ms."
