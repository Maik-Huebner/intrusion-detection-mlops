# Prometheus scrapes the API's /metrics every 5 seconds and evaluates the alert rules.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ids-api
    # Inside the compose network the API is reachable by its service name.
    static_configs:
      - targets: ["api:8000"]
