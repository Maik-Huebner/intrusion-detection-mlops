# Pipeline parameters. `dvc repro` re-runs only the stages whose parameters changed.

# Drift scenario: the model learns from the past and is measured on the future.
# Phase 1 ("Monday-Wednesday"): train on Mon-Wed, face Thu-Fri with attack types never seen before.
split:
  train_days: [monday, tuesday, wednesday]
  future_days: [thursday, friday]
  test_size: 0.2
  random_state: 42

train:
  max_iter: 200
  learning_rate: 0.1
  max_leaf_nodes: 31
  l2_regularization: 0.0
  random_state: 42

evaluate:
  # Alarm if P(attack) >= threshold
  threshold: 0.5

# Second model: which attack type is a flagged flow? (trained on the attack flows only)
family:
  max_iter: 100
  learning_rate: 0.1
  max_leaf_nodes: 31
  random_state: 42
  min_confidence: 0.9  # below this the API reports the type as "uncertain" instead of guessing

# Label-free drift monitoring (offline in the `drift` stage, online in the API).
# Watched: the flows the model lets through as benign, compared with benign training traffic.
drift:
  feature_threshold: 0.2  # PSI above this: the feature has drifted
  share_threshold: 0.1    # more than 10 % drifted features: the traffic has drifted
  window: 1000            # API: sliding window of the most recent "benign" flows

# Promotion thresholds, checked on the test set by `python -m ids.quality_gate`.
# Not a DVC stage: changing them does not retrain anything.
quality_gate:
  min_detection_rate: 0.98
  max_false_alarm_rate: 0.005
  min_f1: 0.98
