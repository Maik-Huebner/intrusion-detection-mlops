# Local stack: MLflow registry, scoring API and monitoring.
#   docker compose --env-file local.env up -d --build      (or: make stack)
#
#   mlflow      tracking server + model registry               http://localhost:5050
#   api         scoring API, serves the registry @champion      http://localhost:8000/docs
#   prometheus  scrapes the API's /metrics, evaluates alerts    http://localhost:9090
#   grafana     SOC & MLOps dashboard                           http://localhost:3000 (GRAFANA_PORT)
#
# Containers reach each other by service name (http://mlflow:5000, http://api:8000).
# All ports are bound to 127.0.0.1: nothing is reachable from the network.

services:
  mlflow:
    build: docker/mlflow
    image: ids-mlflow:3.17.2
    ports:
      # macOS AirPlay occupies port 5000, hence 5050 by default.
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ids-api:0.2.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Rollout = move @champion in the registry, then `docker compose restart api`.
      # Without a champion (fresh clone) the API serves the model baked into the image (fallback).
      MODEL_URI: ${MODEL_URI:-models:/ids-detector@champion}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      # Anonymous access is acceptable only because Grafana listens on 127.0.0.1.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ids-api.json
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/ids-api.json:/var/lib/grafana/dashboards/ids-api.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlflow-data:
    name: ids-mlflow-data
  prometheus-data:
    name: ids-prometheus-data
