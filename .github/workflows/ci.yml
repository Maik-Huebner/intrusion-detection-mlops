name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every Monday 06:17 Berlin time: catches breaking upstream changes and keeps the data cache warm.
    - cron: "17 6 * * 1"
      timezone: "Europe/Berlin"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR cancels the old run; on main every run finishes, so a deployment is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DVC_NO_ANALYTICS: "1"
  UV_HTTP_TIMEOUT: "60"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a hung download must not block the pipeline for hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: lint
      - run: uv sync --locked --no-default-groups --group lint
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a hung download must not block the pipeline for hours
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-default-groups --group test --group api --group tracking
      - name: Unit tests
        run: uv run --no-sync pytest -v

  security:
    # Known vulnerabilities in the locked dependencies, insecure code patterns, leaked secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hung download must not block the pipeline for hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: security
      - name: pip-audit (every dependency in uv.lock)
        run: |
          uv export --locked --all-groups --no-emit-project --no-hashes -o requirements-audit.txt
          # PYSEC-2026-2447 (diskcache pickle cache): no fix exists; only DVC's local cache uses it,
          # never the API image. Accepted risk, see SECURITY.md.
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps --ignore-vuln PYSEC-2026-2447 \
            -r requirements-audit.txt
      - name: Secret scan (gitleaks, whole history)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner

  pipeline:
    # End to end: only when lint and tests are green, CI rebuilds the model from the raw data.
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: pipeline
      - run: uv sync --locked --no-default-groups --group pipeline

      - name: Cache raw data
        # 328 MB from the dataset authors' server: download once, then reuse.
        # The key changes only when the expected checksum in download.py changes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/raw/CICIDS2017_improved.zip
          key: raw-data-${{ hashFiles('src/ids/data/download.py') }}

      - name: Download and verify raw data
        run: uv run --no-sync python -m ids.data.download

      - name: Run pipeline
        run: uv run --no-sync dvc repro --force

      - name: Check reproducibility
        # Same code + same data + same params must give the same results on any machine.
        run: git diff --exit-code metrics.json reports/

      - name: Quality gate
        run: uv run --no-sync python -m ids.quality_gate

      - name: Metrics to job summary
        run: |
          echo "## Metrics" >> "$GITHUB_STEP_SUMMARY"
          uv run --no-sync dvc metrics show --md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: model-${{ github.sha }}
          path: |
            models/model.joblib
            models/family.joblib
            models/reference_profile.json
            metrics.json
            reports/
          retention-days: 30

  image:
    # Continuous delivery: the model CI just trained and gated goes into the API image, tagged with the commit.
    needs: [pipeline, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung download must not block the pipeline for hours
    permissions:
      contents: read
      packages: write  # push to ghcr.io with the workflow's own short-lived token
    env:
      IMAGE: ghcr.io/maik-huebner/intrusion-detection-mlops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Model from the pipeline job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api/Dockerfile
          build-args: REVISION=${{ github.sha }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan of the image (blocks on fixable critical findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          # Secrets are gitleaks' job; Trivy's secret scanner flags example JSON in SDK docstrings.
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test of the image
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/model | tee /dev/stderr | grep -q "\"revision\":\"$GITHUB_SHA\""
      - name: Push
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    # Continuous deployment: the server pulls the new image and restarts; unhealthy = automatic rollback.
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hung download must not block the pipeline for hours
    environment:
      name: production
      url: https://ids.178-104-83-110.sslip.io/docs
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      URL: https://ids.178-104-83-110.sslip.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy over SSH (the key may only run ids-deploy)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned host key of the server: no trust on first use.
          echo "178.104.83.110 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJfNQIm4ix8iqy1LaxsQ0d6TfgjUMO0sIZTm6gezj5kq" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes maik@178.104.83.110 "deploy $GITHUB_SHA"
      - name: Smoke test over the internet
        run: |
          curl -fsS "$URL/health"
          curl -fsS "$URL/model" | tee /dev/stderr | grep -q "\"revision\":\"$GITHUB_SHA\""
          python3 -c "import json; from urllib.request import urlopen; print(json.load(urlopen('$URL/openapi.json'))['info']['version'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/metrics")" = 404  # metrics stay internal
          echo "deployed $GITHUB_SHA to $URL" >> "$GITHUB_STEP_SUMMARY"
