# nginx vhost for the IDS stack (installed by setup-nginx.sh). TLS by Let's Encrypt (certbot --nginx).
# Files in sites-enabled are included in the http block, so the rate limit zone can live here.
limit_req_zone $binary_remote_addr zone=ids_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 12m;

    location / {
        limit_req zone=ids_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8320;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # an analyst note can take a few seconds
    }
}
